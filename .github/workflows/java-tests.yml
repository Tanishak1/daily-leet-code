name: Java Solution Tests
on:
  push:
    paths:
      - 'solutions/**/*.java'
      - 'tests/**'
      - '.github/workflows/java-tests.yml'
  pull_request:
    paths:
      - 'solutions/**/*.java'
      - 'tests/**'
      - '.github/workflows/java-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and execute unit tests
        run: |
          javac tests/JavaSolutionTest.java
          java -cp tests JavaSolutionTest
