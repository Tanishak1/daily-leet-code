name: Validate Java Solutions
on:
  push:
    paths:
      - 'solutions/**/*.java'
      - '.github/workflows/java-validation.yml'
  pull_request:
    paths:
      - 'solutions/**/*.java'
      - '.github/workflows/java-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile each solution independently
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            tmpdir="$(mktemp -d)"
            cp "$file" "$tmpdir/Solution.java"
            javac -d "$tmpdir" "$tmpdir/Solution.java"
            rm -rf "$tmpdir"
            count=$((count + 1))
          done < <(find solutions -type f -name '*.java' -print0)
          test "$count" -gt 0
          echo "Compiled $count Java solutions successfully."
